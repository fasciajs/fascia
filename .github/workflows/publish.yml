name: publish

# A publish cannot be undone. A version that reached the registry stays there under that number,
# even after an unpublish. So the version in each manifest is the whole decision: a merge whose
# version already has a tag publishes nothing, and a merge that carries a bump publishes it.
# Review the diff that bump.mjs writes, because merging it is the last step a person takes.
#
# workflow_dispatch stays, so a run that failed halfway can be started again without a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two runs at once would each read `git tag`, each find the same version untagged, and each try to
# publish it. The second run reaches a registry that already holds the version and stops there.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  # `id-token` is what npm reads instead of a stored token. `contents` is for the tag and the
  # release that publish.mjs writes.
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # publish.mjs reads `git tag` to find what is already published.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The setup step built the workspace, so this reads what the publish will ship.
      - name: Check
        run: npm run check

      # publish.mjs writes a lightweight tag, which is a ref and holds no author. So this step needs
      # no git identity. `gh release create` is the one command that reads GITHUB_TOKEN.
      #
      # Provenance is asked for here rather than in publish.mjs, because provenance needs the OIDC
      # token that only this workflow holds. The same script publishes the first version of a name
      # from a person's machine, where the flag would fail. npm attests provenance on a trusted
      # publish without being asked, and reports say the flag is what makes it happen.
      - name: Publish
        run: node publish.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
